<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Bambuu // Spotify Generator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container container-narrow">
        <header>
            <p class="eyebrow">Private tool</p>
            <h1>Spotify Embed Generator</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="private/index.html">Back to private hub</a>
            </nav>
        </header>

        <main>
            <div class="card generator-card">
                <p class="card-eyebrow tool-eyebrow">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24 0-.36-.06-.6-.18-1.68-1.02-3.72-1.56-6.06-1.56-1.38 0-2.82.18-4.2.6-.301.121-.42.121-.541.121-.42 0-.72-.301-.72-.72 0-.42.181-.66.601-.78 1.68-.48 3.301-.72 5.041-.72 2.581 0 4.861.66 6.781 1.86.181.12.361.301.361.66-.001.42-.301.72-.663.72zm1.44-3.3c-.301 0-.48-.12-.72-.301-1.923-1.14-4.8-1.68-7.32-1.68-1.381 0-2.882.18-4.14.545-.24.06-.361.121-.601.121-.479 0-.9-.421-.9-.9 0-.48.241-.8.66-.9 1.622-.481 3.242-.72 4.982-.72 2.881 0 5.881.601 8.161 1.92.301.18.48.42.48.9-.001.481-.361.921-.902.921l-.12.006zm1.66-3.902c-.3 0-.42-.06-.66-.18-2.161-1.28-5.522-1.68-8.281-1.68-1.541 0-3.121.18-4.622.6-.181.061-.42.121-.66.121-.601 0-1.081-.481-1.081-1.081 0-.601.362-.961.72-1.081 1.98-.601 3.842-.72 5.643-.72 3.081 0 6.72.601 9.34 2.16.36.181.601.481.601 1.021 0 .601-.42 1.08-.98 1.08l-.02-.24z"/></svg>
                    Spotify embed generator
                </p>
                <h2>Turn a link into a playable embed</h2>
                <p>Paste a regular Spotify link and we'll convert it into an embed link you can drop into your page.</p>

                <label for="input">Spotify link</label>
                <div class="input-row">
                    <input type="text" id="input" placeholder="https://open.spotify.com/track/60a0Rd6pjrkxjPbaKzXjfq?si=...">
                    <button class="btn" id="convertBtn">Convert</button>
                </div>
                <p class="hint" id="hint">Works with tracks, albums, playlists, artists, episodes and shows.</p>

                <div class="result" id="result">
                    <label>Embed link</label>
                    <div class="output-row">
                        <div class="output-box" id="output"></div>
                        <button class="btn btn-ghost" id="copyBtn">Copy</button>
                    </div>

                    <label>Preview</label>
                    <iframe id="preview" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </main>
    </div>

<script>
const input = document.getElementById('input');
const convertBtn = document.getElementById('convertBtn');
const hint = document.getElementById('hint');
const result = document.getElementById('result');
const output = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');
const preview = document.getElementById('preview');

const heights = {
  track: 152, episode: 152, show: 152,
  album: 352, playlist: 352, artist: 352
};

function convert(){
  const raw = input.value.trim();
  if(!raw){
    setHint('Paste a Spotify link first.', 'error');
    result.classList.remove('visible');
    return;
  }

  let url;
  try{
    url = new URL(raw);
  }catch(e){
    setHint('That doesn\'t look like a valid link.', 'error');
    result.classList.remove('visible');
    return;
  }

  if(!url.hostname.includes('open.spotify.com')){
    setHint('The link must be from open.spotify.com.', 'error');
    result.classList.remove('visible');
    return;
  }

  const match = url.pathname.match(/^\/(?:intl-[a-z]{2}\/)?(track|album|playlist|artist|episode|show)\/([a-zA-Z0-9]+)/);
  if(!match){
    setHint('No track/album/playlist/artist/episode/show link found.', 'error');
    result.classList.remove('visible');
    return;
  }

  const [, type, id] = match;
  const embedUrl = `https://open.spotify.com/embed/${type}/${id}`;

  output.textContent = embedUrl;
  preview.src = embedUrl;
  preview.height = heights[type] || 152;
  result.classList.add('visible');
  setHint(`Done — that was a ${type} link.`, 'ok');
  copyBtn.textContent = 'Copy';
  copyBtn.classList.remove('copied');
}

function setHint(text, kind){
  hint.textContent = text;
  hint.className = 'hint' + (kind ? ' ' + kind : '');
}

convertBtn.addEventListener('click', convert);
input.addEventListener('keydown', e => { if(e.key === 'Enter') convert(); });

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(output.textContent).then(() => {
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1500);
  });
});
</script>
</body>
</html>
