<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambuu Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Bambuu Hub</h1>
        <p>Welcome to the main station.</p>
        
        <div class="button-grid">
            <button class="btn" onclick="openLogin()">Access Private Area</button>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h3>Enter Password</h3>
            <input type="password" id="pass-input" placeholder="Password...">
            <button class="btn" onclick="checkPassword()">Submit</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
