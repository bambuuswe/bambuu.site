<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BAMBUU.OS // Booting...</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    
    <div id="boot-screen">
        <div class="terminal-text">
            <p>BAMBUU BIOS V2.0.26</p>
            <p>Loading System... <span id="boot-status">OK</span></p>
        </div>
    </div>

    <div id="desktop" style="display: none;">
        <div class="desktop-icon" id="system-trigger">
            <img src="https://win98icons.alexmeub.com/icons/key-0.png" alt="System">
            <span>System</span>
        </div>
    </div>

    <div id="login-window" class="window" style="display: none;">
        <div class="window-header">
            <span>Login</span>
            <button onclick="closeLogin()">X</button>
        </div>
        <div class="window-content">
            <p>Enter Password:</p>
            <input type="password" id="pass-input">
            <button onclick="checkPassword()">OK</button>
        </div>
    </div>

    <div id="taskbar">
        <button id="start-btn">Start</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
